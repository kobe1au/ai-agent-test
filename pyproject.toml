readme = "README.md"
authors = [
    { name = "kobe1au", email = "zliuqingtx@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-agent-test = "ai_agent_test:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
